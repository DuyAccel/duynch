{{ define "main" }}
<div class="list-header">
  <h1>{{ .Title }}</h1>
  {{ if .Content }}<div class="list-content">{{ .Content }}</div>{{ end }}
</div>

<div class="card-grid">
  {{ range .Pages }}
  <a href="{{ .Permalink }}" class="card">
    {{ if .Params.image }}
      <img src="{{ .Params.image }}" alt="{{ .Title }}">
    {{ else }}
      <img src="https://via.placeholder.com/400x200/5c5f77/eff1f5.png?text=Draft" alt="Placeholder">
    {{ end }}
    <div class="card-content">
      <h3>{{ .Title }}</h3>
      <p>{{ .Summary | truncate 150 }}</p>
      <small>{{ .Date.Format "02 Jan 2006" }}</small>
    </div>
  </a>
  {{ end }}
</div>
{{ end }}
